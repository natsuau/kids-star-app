<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9ce8f5">
  <title>Kids Star App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">Draw, learn, and shine!</p>
      <h1><span aria-hidden="true">⭐</span> Kids Star App</h1>
      <p class="subtitle">てんを つないで ほしを かこう</p>
    </header>

    <section id="menuPage" class="page" aria-labelledby="menuTitle">
      <h2 id="menuTitle">Choose Your Magic Star</h2>

      <div class="category-card">
        <div class="category-heading">
          <span class="category-icon" aria-hidden="true">✏️</span>
          <div>
            <h3>One-Stroke Stars</h3>
            <p>ひとふでで かける ほし</p>
          </div>
        </div>
        <div id="oneStrokeMenu" class="star-grid">
          <button class="star-button" type="button" data-star="5">
            <span class="star-symbol" aria-hidden="true">★</span>
            <span>5 Pointed Star</span>
            <span class="clear-badge" data-clear-for="5" hidden>Clear!</span>
          </button>
          <button class="star-button" type="button" data-star="7">
            <span class="star-symbol" aria-hidden="true">★</span>
            <span>7 Pointed Star</span>
            <span class="clear-badge" data-clear-for="7" hidden>Clear!</span>
          </button>
          <button class="star-button" type="button" data-star="8">
            <span class="star-symbol" aria-hidden="true">★</span>
            <span>8 Pointed Star</span>
            <span class="clear-badge" data-clear-for="8" hidden>Clear!</span>
          </button>
          <button class="star-button" type="button" data-star="10">
            <span class="star-symbol" aria-hidden="true">★</span>
            <span>10 Pointed Star</span>
            <span class="clear-badge" data-clear-for="10" hidden>Clear!</span>
          </button>
        </div>
      </div>

      <div class="category-card secondary-category">
        <div class="category-heading">
          <span class="category-icon" aria-hidden="true">✌️</span>
          <div>
            <h3>Two-Stroke Stars</h3>
            <p>2かいに わけて かく ほし</p>
          </div>
        </div>
        <div class="star-grid one-item">
          <button class="star-button" type="button" data-star="6">
            <span class="star-symbol" aria-hidden="true">✡</span>
            <span>6 Pointed Star</span>
            <span class="clear-badge" data-clear-for="6" hidden>Clear!</span>
          </button>
        </div>
      </div>
    </section>

    <section id="modePage" class="page" aria-labelledby="selectedStarTitle" hidden>
      <button class="back-link" id="modeBackButton" type="button">← Star Menu</button>
      <div class="mode-heading">
        <span class="large-star" aria-hidden="true">★</span>
        <h2 id="selectedStarTitle"></h2>
        <p>どの れんしゅうを する？</p>
      </div>

      <div class="mode-list">
        <button class="mode-button watch" type="button" data-mode="watch">
          <span class="mode-number">1</span>
          <span class="mode-copy">
            <strong>書き方を見る</strong>
            <small>うごく せんで じゅんばんを みよう</small>
          </span>
          <span aria-hidden="true">▶</span>
        </button>
        <button class="mode-button trace" type="button" data-mode="trace">
          <span class="mode-number">2</span>
          <span class="mode-copy">
            <strong>なぞりながら書いてみる</strong>
            <small>くろい せんを おいかけよう</small>
          </span>
          <span aria-hidden="true">✍️</span>
        </button>
        <button class="mode-button try" type="button" data-mode="try">
          <span class="mode-number">3</span>
          <span class="mode-copy">
            <strong>自分で一から書いてみる</strong>
            <small>うすい えんと てんだけで ちょうせん</small>
          </span>
          <span aria-hidden="true">✨</span>
        </button>
      </div>
    </section>

    <section id="practicePage" class="page" aria-labelledby="practiceTitle" hidden>
      <div class="practice-topbar">
        <button class="back-link" id="practiceBackButton" type="button">← れんしゅうを えらぶ</button>
        <span id="modeLabel" class="mode-label"></span>
      </div>
      <h2 id="practiceTitle"></h2>
      <p id="instruction" class="instruction" aria-live="polite"></p>

      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="starCanvas" width="600" height="600" aria-label="芒星を描くキャンバス"></canvas>
        <div id="clearCelebration" class="celebration" role="status" hidden>
          <span class="celebration-stars" aria-hidden="true">✨ ⭐ ✨</span>
          <strong>Clear!</strong>
          <span>できたね！</span>
        </div>
      </div>

      <div class="practice-actions">
        <button id="replayButton" class="action-button replay" type="button">▶ もういちど見る</button>
        <button id="resetButton" class="action-button reset" type="button">↻ もういちど</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
